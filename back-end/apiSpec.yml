openapi: "3.0.3"
info:
  title: Team.In-site
  version: "0.1.0"

servers:
  - url: http://localhost:20991/api/v1

tags:
  - name: Auth
  - name: User
  - name: Problems
  - name: Code

paths:
  /health:
    servers:
      - url: http://localhost:20991/
    get:
      responses:
        "200":
          description: OK

  /auth/register:
    post:
      tags: [Auth]
      summary: 회원 가입
      description: "회원가입 시에 사용되는 엔드포인트입니다."
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRegisterRequest" }
      responses:
        "201":
          description: "신규 계정이 생성되고 인증 토큰이 쿠키로 발급됩니다."
          headers:
            Set-Cookie:
              description: "`token=<JWT>` 형태의 httpOnly 쿠키"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: "잘못된 요청(아이디/비밀번호/이메일/선호 정보 검증 실패)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: "아이디 혹은 이메일 중복"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: "서버 내부 오류"

  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      description: "이메일/비밀번호를 검증하고 인증 토큰을 발급합니다."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthLoginRequest" }
      responses:
        "200":
          description: "로그인 성공. 인증 토큰이 쿠키로 발급됩니다."
          headers:
            Set-Cookie:
              description: "`token=<JWT>` 형태의 httpOnly 쿠키"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          description: "이메일/비밀번호 누락 혹은 형식 오류"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: "이메일 혹은 비밀번호 불일치"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: "서버 내부 오류"

  /code:
    post:
      tags: [Code]
      summary: 코드 저장
      description: "사용자의 현재 코드를 저장하고, 이전 코드와의 차이(diff)를 계산합니다. 인증이 필요합니다."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveCodeRequest" }
      responses:
        "200":
          description: "코드 저장 성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaveCodeResponse" }
        "400":
          description: "잘못된 요청 (코드 타입 오류, 언어 타입 오류 등)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: "인증되지 않은 사용자"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: "서버 내부 오류"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /code/tokenize:
    post:
      tags: [Code]
      summary: 코드 토큰화
      description: "tiktoken 기반으로 코드 문자열을 토큰화합니다."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeTokenizeRequest" }
      responses:
        "200":
          description: "토큰화 결과"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeTokenizeResponse" }
        "400":
          description: "잘못된 요청 혹은 토큰 수 초과"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413":
          description: "코드 길이가 허용 범위를 초과"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: "서버 내부 오류"

  /problems:
    get:
      tags: [Problems]
      summary: 문제 목록 조회
      description: "필터와 페이징을 적용하여 문제 목록을 조회합니다."
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
          description: "페이지 번호 (1부터 시작)"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
          description: "한 페이지에 포함될 문제 개수"
        - in: query
          name: difficulties
          schema: { type: string }
          description: "쉼표로 구분된 난이도 목록 (예: `1,2,3`)"
        - in: query
          name: languages
          schema: { type: string }
          description: "쉼표로 구분된 언어 목록 (예: `js,py`)"
        - in: query
          name: main_category
          schema: { type: string }
          description: "문제의 대분류"
        - in: query
          name: sub_category
          schema: { type: string }
          description: "문제의 소분류"
      responses:
        "200":
          description: "문제 목록 조회 성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemListResponse" }
        "400":
          description: "잘못된 필터 혹은 페이징 값"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: "서버 내부 오류"

  /problems/{problemId}:
    get:
      tags: [Problems]
      summary: 문제 상세 조회
      parameters:
        - in: path
          name: problemId
          required: true
          schema: { type: string, format: UUIDv7 }
          description: "문제의 ID (uuid v7)"
      responses:
        "200":
          description: "문제 상세 조회 성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "400":
          description: "잘못된 문제 ID"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: "서버 내부 오류"

  /user/check-id/{user_id}:
    get:
      tags: [User]
      summary: 아이디 중복 여부 확인
      description: "가입 전에 특정 아이디가 사용 가능한지 확인합니다."
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 50
            pattern: "^[a-zA-Z0-9_-]+$"
          description: "중복 여부를 확인할 아이디"
      responses:
        "200":
          description: "아이디 사용 가능 여부"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCheckIdResponse" }
        "400":
          description: "아이디가 요구 조건을 만족하지 않음"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: "서버 내부 오류"

  /user/stats:
    get:
      tags: [User]
      summary: 사용자 통계 조회
      description: "로그인한 사용자의 프로필, 통계, 배지, 히트맵 정보를 조회합니다."
      responses:
        "200":
          description: "사용자 통계 조회 성공"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStatsResponse" }
        "401":
          description: "인증되지 않은 사용자"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: "서버 내부 오류"

components:
  schemas:
    # ==== AUTH ====
    AuthRegisterRequest:
      type: object
      required: [user_id, email, password, language, level, purpose]
      properties:
        user_id:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[a-zA-Z0-9_-]+$"
          description: "3~50자의 영문/숫자/언더스코어/하이픈(앞뒤 공백은 자동 제거)"
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
        language:
          type: string
          enum: [py, js, cpp, other]
          description: "선호 프로그래밍 언어"
        level:
          type: integer
          minimum: 1
          maximum: 4
          description: "숙련도(1~4)"
        purpose:
          type: string
          enum: [prob, proj, learn]
          description: "가입 목적"

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          format: password

    AuthResponse:
      type: object
      required: [user_id, email]
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email

    ErrorResponse:
      type: object
      required: [name, message]
      properties:
        name:
          type: string
          description: "서버에서 정의한 에러 식별자"
        message:
          type: string
          description: "사용자에게 전달되는 에러 메시지"
        stack:
          type: string
          description: "개발 환경에서만 노출되는 stack trace"

    # ==== USER ====
    UserCheckIdResponse:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
          description: "true이면 아직 사용되지 않은 아이디"

    UserStatsResponse:
      type: object
      required:
        [
          profile,
          stats,
          badges,
          levelDistribution,
          languageDistribution,
          heatmap,
        ]
      properties:
        profile:
          type: object
          required:
            [
              nickname,
              avatarImage,
              bio,
              level,
              exp,
              preferLanguage,
              totalSolved,
              rank,
            ]
          properties:
            nickname:
              type: string
            avatarImage:
              type: string
              description: "레벨에 따른 아바타 이미지 경로"
            bio:
              type: string
              description: "가입 목적에 따른 상태 메시지"
            level:
              type: integer
            exp:
              type: integer
            preferLanguage:
              type: string
            totalSolved:
              type: integer
            rank:
              type: string
              description: "현재는 Unranked 고정"
        stats:
          type: object
          required: [streak, todaySolved, thisWeekSolved, mostUsedLanguage]
          properties:
            streak:
              type: integer
            todaySolved:
              type: integer
            thisWeekSolved:
              type: integer
            mostUsedLanguage:
              type: string
        badges:
          type: array
          items: { type: string }
          description: "현재는 빈 배열"
        levelDistribution:
          type: object
          additionalProperties:
            type: integer
          description: "레벨별 문제 풀이 수 (예: { '1': 10, '2': 5 })"
        languageDistribution:
          type: object
          additionalProperties:
            type: integer
          description: "언어별 문제 풀이 수 (예: { 'js': 10, 'py': 5 })"
        heatmap:
          type: object
          additionalProperties:
            type: integer
          description: "날짜별 문제 풀이 수 (예: { '2023-10-01': 3 })"

    # ==== PROBLEMS ====
    ProblemSummary:
      type: object
      required:
        [
          id,
          title,
          difficulty,
          language,
          main_category,
          sub_category,
          success_rate,
        ]
      properties:
        id:
          type: string
          description: "문제를 식별하는 uuid v7"
        title:
          type: string
          description: "문제 제목"
        difficulty:
          type: integer
          minimum: 1
          maximum: 5
        language:
          type: array
          items: { type: string }
          description: "출제 언어(복수)"
        main_category:
          type: array
          items: { type: string }
          description: "문제의 대분류"
        sub_category:
          type: array
          items: { type: string }
          description: "문제의 소분류"
        success_rate:
          type: number
          format: float
          description: "정답 비율(0~100)"

    ProblemDetail:
      allOf:
        - $ref: "#/components/schemas/ProblemSummary"
        - type: object
          required: [body, attachments_urls]
          properties:
            body:
              type: string
            attachments_urls:
              type: array
              items: { type: string, format: uri }
            test_cases:
              type: array
              items: { type: string }
              description: "테스트 케이스 목록"
            time_limit:
              type: integer
              description: "시간 제한 (밀리초 단위)"
            memory_limit:
              type: integer
              description: "메모리 제한 (바이트 단위)"

    ProblemListResponse:
      type: object
      required: [pagination, problems]
      properties:
        pagination:
          type: object
          required: [page, limit, total_count, total_pages]
          properties:
            page:
              type: integer
              minimum: 1
            limit:
              type: integer
              minimum: 1
              maximum: 50
            total_count:
              type: integer
              minimum: 0
            total_pages:
              type: integer
              minimum: 0
        problems:
          type: array
          items: { $ref: "#/components/schemas/ProblemSummary" }

    # ==== CODE ====
    SaveCodeRequest:
      type: object
      required: [code, language]
      properties:
        code:
          type: string
          description: "저장할 코드 문자열"
        language:
          type: string
          enum: [js, py]
          description: "프로그래밍 언어"

    SaveCodeResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          description: "저장 성공 여부"

    CodeTokenizeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: "토큰화할 코드 문자열"
          maxLength: 200000

    CodeTokenizeResponse:
      type: object
      required: [token_count]
      properties:
        token_count:
          type: integer
          description: "전체 토큰 수"
